name: Midnight dApp CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Compile Compact Smart Contracts
        run: npx tsx scripts/compile-contract.ts

      - name: Run Vitest Unit & Circuit Test Suite
        run: npx vitest run

      - name: Build Application Bundle
        run: npm run build
